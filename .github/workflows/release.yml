name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string
      publish:
        description: Publish crates and npm packages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            network: base
          - runner: macos-14
            target: aarch64-apple-darwin
            network: base
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release -p lunarbase-indexer --no-default-features --features "${{ matrix.network }}" --target "${{ matrix.target }}"
      - run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lunarbase-indexer" \
            "dist/lunarbase-indexer-${{ matrix.network }}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: lunarbase-indexer-${{ matrix.network }}-${{ matrix.target }}
          path: dist/*

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GITHUB_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install E2E and Monad native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-19 \
            clang-tools-19 \
            libclang-19-dev \
            cmake \
            libhugetlbfs-dev \
            redis-server
          {
            echo "CC=clang-19"
            echo "CXX=clang++-19"
            echo "LIBCLANG_PATH=/usr/lib/llvm-19/lib"
          } >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
          clang-19 --version
          test -f /usr/lib/llvm-19/lib/libclang.so
      - run: pnpm install --frozen-lockfile
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.97.1"
      - name: Validate release versions
        run: node scripts/check-release-version.mjs "${RELEASE_TAG}"
      - name: Run every release gate
        run: make verify check-network-features docker-image-check test-process-e2e release-check
      - name: Audit production npm dependencies
        run: make audit-ts
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages-${{ env.RELEASE_TAG }}
          path: dist/*.tgz

  performance:
    runs-on: [self-hosted, linux, x64, lunarbase-performance]
    timeout-minutes: 90
    env:
      PERFORMANCE_BASELINE_REF: ${{ vars.LUNARBASE_PERFORMANCE_BASELINE_REF }}
    steps:
      - name: Require an immutable performance baseline
        run: |
          if [[ ! "${PERFORMANCE_BASELINE_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "LUNARBASE_PERFORMANCE_BASELINE_REF must be a full 40-hex commit" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: current
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: baseline
          persist-credentials: false
          ref: ${{ env.PERFORMANCE_BASELINE_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Capture the pinned baseline
        working-directory: baseline
        run: make performance-capture PERF_OUTPUT="${RUNNER_TEMP}/lunarbase-performance-baseline"
      - name: Capture the release candidate
        working-directory: current
        run: make performance-capture PERF_OUTPUT="${RUNNER_TEMP}/lunarbase-performance-current"
      - name: Reject quote-path regressions
        working-directory: current
        run: |
          make performance-gate \
            PERF_BASELINE="${RUNNER_TEMP}/lunarbase-performance-baseline" \
            PERF_CURRENT="${RUNNER_TEMP}/lunarbase-performance-current"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ env.RELEASE_TAG }}
          path: |
            ${{ runner.temp }}/lunarbase-performance-baseline
            ${{ runner.temp }}/lunarbase-performance-current
          if-no-files-found: ignore
          retention-days: 30

  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: [binaries, gate, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    concurrency:
      group: lunarbase-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Verify release ancestry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          release_ref="refs/tags/${RELEASE_TAG}"
          release_commit="$(git rev-parse --verify "${release_ref}^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"

          if [[ "${checkout_commit}" != "${release_commit}" ]]; then
            echo "checked out commit does not match ${release_ref}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${release_commit}" "${main_commit}"; then
            echo "${release_ref} is not contained in origin/main" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages-${{ env.RELEASE_TAG }}
          path: dist
      - name: Verify registry credentials
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN}" || { echo "CARGO_REGISTRY_TOKEN is not configured" >&2; exit 1; }
          test -n "${NPM_TOKEN}" || { echo "NPM_TOKEN is not configured" >&2; exit 1; }
      - name: Publish Rust crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh
      - name: Publish npm packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.mjs
