[workspace]
members = [
    "crates/lunarbase-math",
    "crates/lunarbase-client",
    "crates/lunarbase-monad-sidecar",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.77"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
lunarbase-math = { path = "crates/lunarbase-math" }
lunarbase-client = { path = "crates/lunarbase-client" }
ruint = { version = "1.19", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
redis = "0.27"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
tiny-keccak = { version = "2", features = ["keccak"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
