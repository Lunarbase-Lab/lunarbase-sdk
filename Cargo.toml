[workspace]
members = [
    "crates/lunarbase-math",
    "crates/lunarbase-client-core",
    "crates/lunarbase-client-base",
    "crates/lunarbase-client-monad",
    "crates/lunarbase-client-arbitrum",
    "crates/lunarbase-indexer",
    "crates/lunarbase-tools",
    "examples/rust/quote-logger",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Lunarbase-Lab/lunarbase-sdk"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
lunarbase-math = { version = "0.2.0", path = "crates/lunarbase-math" }
lunarbase-client-core = { version = "0.2.0", path = "crates/lunarbase-client-core" }
lunarbase-client-base = { version = "0.2.0", path = "crates/lunarbase-client-base" }
lunarbase-client-monad = { version = "0.2.0", path = "crates/lunarbase-client-monad" }
lunarbase-client-arbitrum = { version = "0.2.0", path = "crates/lunarbase-client-arbitrum" }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std", "serde"] }
alloy-eips = { version = "=2.2.0", default-features = false }
alloy-provider = { version = "=2.2.0", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-rpc-types-eth = { version = "=2.2.0", default-features = false, features = ["serde"] }
alloy-serde = { version = "=2.2.0", default-features = false }
alloy-sol-types = "=1.6.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
redis = "0.27"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.24"
axum = { version = "0.7.9", features = ["ws"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
toml = "0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15.7"
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
