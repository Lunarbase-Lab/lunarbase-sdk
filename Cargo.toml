[workspace]
members = [
    "crates/lunarbase-math",
    "crates/lunarbase-client",
    "crates/lunarbase-source-evm",
    "crates/lunarbase-source-monad",
    "crates/lunarbase-source-monad-native",
    "crates/lunarbase-source-arbitrum",
    "crates/lunarbase-indexer",
    "crates/lunarbase-event-worker",
    "crates/lunarbase-tools",
    "examples/rust/quote-logger",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.4.1"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
repository = "https://github.com/Lunarbase-Lab/lunarbase-sdk"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"

[workspace.dependencies]
lunarbase-math = { package = "lunarbase-pmm-v2-math", version = "0.4.1", path = "crates/lunarbase-math" }
lunarbase-client = { package = "lunarbase-pmm-v2-client", version = "0.4.1", path = "crates/lunarbase-client" }
lunarbase-source-evm = { package = "lunarbase-pmm-v2-source-evm", version = "0.4.1", path = "crates/lunarbase-source-evm" }
lunarbase-source-monad = { package = "lunarbase-pmm-v2-source-monad", version = "0.4.1", path = "crates/lunarbase-source-monad" }
lunarbase-source-monad-native = { version = "0.4.1", path = "crates/lunarbase-source-monad-native", default-features = false }
lunarbase-source-arbitrum = { package = "lunarbase-pmm-v2-source-arbitrum", version = "0.4.1", path = "crates/lunarbase-source-arbitrum" }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std", "serde"] }
alloy-rpc-client = { version = "=2.2.0", default-features = false, features = ["reqwest"] }
alloy-serde = { version = "=2.4.1", default-features = false }
alloy-sol-types = "=1.6.1"
alloy-transport = { version = "=2.2.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
arc-swap = "1.9.2"
redis = { version = "0.27", default-features = false }
tokio = { version = "1", features = ["macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
clap = { version = "4.5.60", features = ["derive", "env"] }
toml = "0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
dotenvy = "0.15.7"
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1

[profile.test]
debug = 1
