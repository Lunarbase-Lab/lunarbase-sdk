# Base runtime profile for the Docker Compose example.
network = "base"
chain_id = 8453
fee_class = "whitelisted"
contract_compatibility_version = "lunarbase-pmm-v2"
delivery_mode = "realtime"
explicit_lane_assets = []
bind = "0.0.0.0:8080"
queue_bound = 16384
queue_byte_bound = 67108864
reconnect_delay_milliseconds = 500
source_stall_timeout_milliseconds = 30000
source_operation_timeout_milliseconds = 15000
max_in_flight_quotes = 1024
redis_url = "redis://redis:6379/"
checkpoint_interval_seconds = 30
shutdown_timeout_seconds = 20
