[profile.default]
src = "src"
test = "test"
out = "target/out"
cache_path = "target/cache"
libs = ["../../lunarbase-contracts/dependencies"]
optimizer = true
optimizer_runs = 5000000

remappings = [
    "@/=../../lunarbase-contracts/src/",
    "@forge-std/=../../lunarbase-contracts/dependencies/forge-std-1.16.1/",
    "@openzeppelin-contracts/=../../lunarbase-contracts/dependencies/@openzeppelin-contracts-5.6.1/",
    "@solady/=../../lunarbase-contracts/dependencies/solady-0.1.26/src/"
]
