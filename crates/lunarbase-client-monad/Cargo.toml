[package]
name = "lunarbase-client-monad"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Experimental Monad execution-events runtime client for LunarBase"

[features]
default = []
native-event-ring = ["dep:monad-event-ring", "dep:monad-exec-events"]

[lints]
workspace = true

[dependencies]
async-stream.workspace = true
futures-util.workspace = true
lunarbase-client-core.workspace = true
lunarbase-math.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
monad-event-ring = { git = "https://github.com/category-labs/monad-bft", tag = "release/exec-events-sdk-v1.0", optional = true }
monad-exec-events = { git = "https://github.com/category-labs/monad-bft", tag = "release/exec-events-sdk-v1.0", optional = true }
