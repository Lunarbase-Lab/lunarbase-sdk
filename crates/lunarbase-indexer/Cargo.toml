[package]
name = "lunarbase-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Runnable LunarBase indexing and quote HTTP service"
publish = false

[features]
default = ["base"]
base = ["dep:lunarbase-client-base"]
monad = ["dep:lunarbase-client-monad"]
monad-native = ["monad", "lunarbase-client-monad/native-event-ring"]
arbitrum = ["dep:lunarbase-client-arbitrum"]
all-networks = ["base", "monad", "arbitrum"]

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
lunarbase-client-arbitrum = { workspace = true, optional = true }
lunarbase-client-base = { workspace = true, optional = true }
lunarbase-client-core.workspace = true
lunarbase-client-monad = { workspace = true, optional = true }
lunarbase-math.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
