[package]
name = "lunarbase-event-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Durable LunarBase Core event ingestion service"
publish = false

[features]
default = ["base"]
evm = ["dep:lunarbase-source-evm"]
base = ["evm"]
monad = ["dep:lunarbase-source-monad", "lunarbase-source-monad/protocol-v2"]
monad-native = [
    "monad",
    "dep:lunarbase-source-monad-native",
    "lunarbase-source-monad-native/native-event-ring",
]
arbitrum = ["evm", "dep:lunarbase-source-arbitrum"]
all-networks = ["base", "monad", "arbitrum"]

[lints]
workspace = true

[dependencies]
alloy-primitives.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
lunarbase-client.workspace = true
lunarbase-source-arbitrum = { workspace = true, optional = true }
lunarbase-source-evm = { workspace = true, optional = true }
lunarbase-source-monad = { workspace = true, optional = true }
lunarbase-source-monad-native = { workspace = true, optional = true }
redis = { workspace = true, features = ["script", "streams"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
